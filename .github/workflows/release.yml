name: release

on:
    workflow_dispatch:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-26.04-arm
        timeout-minutes: 90
        env:
            LLVM_CONFIG: llvm-config-21
            CXX: clang++-21
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check release tag
              if: github.ref_type == 'tag'
              run: test "$GITHUB_REF_NAME" = "v$(jq -r .version app/appinfo.json)"

            - uses: oven-sh/setup-bun@v2

            - uses: extractions/setup-just@v4
              with:
                  just-version: "1.59.0"

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends clang-21 llvm-21-dev ccache meson libexpat1-dev trash-cli
                  bun install --frozen-lockfile

            - name: Cache toolchain
              id: toolchain
              uses: actions/cache@v6
              with:
                  path: .cache/toolchain
                  key: ubuntu-26.04-arm-llvm21-${{ hashFiles('scripts/toolchain.sources', 'scripts/setup-*.sh', 'scripts/env.sh', 'scripts/platform/**', 'patches/odin-arm32-softfp.patch', 'patches/sdl3-b9.patch') }}

            - name: Build toolchain
              if: steps.toolchain.outputs.cache-hit != 'true'
              run: just setup

            - name: Build release files
              run: just release

            - uses: actions/upload-artifact@v7
              with:
                  name: leantube-arm32
                  path: build/release/
                  if-no-files-found: error

    publish:
        if: github.event_name == 'push' && github.ref_type == 'tag'
        needs: build
        runs-on: ubuntu-26.04-arm
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: leantube-arm32
                  path: release

            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "$GITHUB_REF_NAME" release/*/*.ipk release/*/repo.json \
                    --repo "$GITHUB_REPOSITORY" --verify-tag \
                    --title "LeanTube $GITHUB_REF_NAME" --notes-file release/*/notes.md
