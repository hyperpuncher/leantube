name: release

on:
    workflow_dispatch:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-26.04-arm
        timeout-minutes: 90
        env:
            LLVM_CONFIG: llvm-config-21
            CXX: clang++-21
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Check release tag
              if: github.ref_type == 'tag'
              run: test "$GITHUB_REF_NAME" = "v$(jq -r .version app/appinfo.json)"

            - uses: oven-sh/setup-bun@v2

            - name: Install build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends clang-21 llvm-21-dev ccache meson libexpat1-dev trash-cli just
                  bun install --frozen-lockfile

            - name: Cache toolchain
              id: toolchain
              uses: actions/cache@v6
              with:
                  path: .cache/toolchain
                  key: ubuntu-26.04-arm-llvm21-${{ hashFiles('scripts/toolchain.sources', 'scripts/setup-*.sh', 'scripts/env.sh', 'scripts/platform/**', 'patches/odin-arm32-softfp.patch', 'patches/sdl3-b9.patch') }}

            - name: Build toolchain
              if: steps.toolchain.outputs.cache-hit != 'true'
              run: just setup

            - name: Build both app packages
              run: just release

            - uses: actions/upload-artifact@v7
              with:
                  name: leantube-arm32
                  path: |
                      build/release/
                      build/app/appinfo.json
                      build/legacy/app/appinfo.json
                  if-no-files-found: error

    publish:
        if: github.event_name == 'push' && github.ref_type == 'tag'
        needs: build
        runs-on: ubuntu-slim
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: oven-sh/setup-bun@v2

            - uses: actions/download-artifact@v8
              with:
                  name: leantube-arm32
                  path: build

            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  directory="build/release/${GITHUB_REF_NAME#v}"
                  gh release create "$GITHUB_REF_NAME" "$directory"/*.ipk \
                    --verify-tag --draft --title "$GITHUB_REF_NAME" --notes ""
                  gh release view "$GITHUB_REF_NAME" --json assets | bun scripts/release.ts
                  gh release upload "$GITHUB_REF_NAME" "$directory/repo.json"
                  gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "$directory/notes.md"
